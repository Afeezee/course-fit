## Railway config for the single CourseFit service.
##
## ONE service, ONE deploy. The Dockerfile is a multi-stage build:
##   stage 1  — Node: builds the Next.js static export (apps/web/out/)
##   stage 2  — Python: installs API deps, copies ml/, copies web/out/
##                     and runs uvicorn which serves BOTH:
##                       /api/*   — the recommender API
##                       /...     — the static web assets
##
## In Railway service settings:
##   Root Directory:  (blank — whole repo is the build context)
##   Config Path:     apps/api/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
# Rebuild on any code change — this one service owns both sides now.
watchPatterns = ["apps/api/**", "apps/web/**", "ml/**"]

[deploy]
# The Dockerfile's CMD handles uvicorn startup + $PORT binding.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 30
