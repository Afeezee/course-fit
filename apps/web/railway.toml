## Railway config for the Next.js frontend.
##
## Deploy pattern: monorepo root. In the Railway service settings, leave
## the "Root Directory" EMPTY and set "Config Path" to
## `apps/web/railway.toml` — this file. The build and start commands
## `cd` into apps/web themselves. Keeps the two services in one Railway
## project without duplicating the repo.

[build]
builder = "NIXPACKS"
buildCommand = "cd apps/web && npm ci && npm run build"
watchPatterns = ["apps/web/**"]

[deploy]
startCommand = "cd apps/web && npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
